name: Image provisioning package checks
on:
  pull_request:
    paths:
      - bash/common/**
      - bash/debian/**
      - bash/config/**
      - packaging/**
      - tests/**
      - .github/workflows/image-provisioning-check.yaml
  push:
    branches: [main]
    paths:
      - bash/common/**
      - bash/debian/**
      - bash/config/**
      - packaging/**
      - tests/**
      - .github/workflows/image-provisioning-check.yaml
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Build and test the candidate package
        run: bash tests/check-package.sh
